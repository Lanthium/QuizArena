<!doctype html><html lang="en"><head><title>QuizArena</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{--bg:#f6f5f1;--card:#fff;--tx:#1f1f1d;--mu:#6b6a65;--bd:#e0ded7;--ac:#4f46e5;--ok:#0f9d6b;--bad:#d9480f;--warn:#e8a317;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17171a;--card:#232328;--tx:#ececec;--mu:#9b9aa3;--bd:#34343b;color-scheme:dark}}:root[data-theme=dark]{--bg:#17171a;--card:#232328;--tx:#ececec;--mu:#9b9aa3;--bd:#34343b;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;padding:16px}h1{font-size:22px;margin:0}button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu);font-size:13px}</style><style>.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}.col{min-height:220px}.col h2{font-size:15px;margin:0 0 8px}.t{margin:8px 0;cursor:grab;border-left:4px solid var(--warn)}.t.High{border-color:var(--bad)}.t.Low{border-color:var(--ok)}.od{color:var(--bad);font-weight:600}.over{outline:2px dashed var(--ac)}.bar{height:8px;background:var(--bd);border-radius:6px;margin-top:10px}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}</style><style>.w{max-width:620px;margin:0 auto}.o{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}.o.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.o.no{background:var(--bad);color:#fff;border-color:var(--bad)}.bar{height:8px;background:var(--bd);border-radius:6px;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width 1s linear}</style></head><body><div class="w"><h1>QuizArena</h1><div id="m"></div></div>
<script>
var Q={"Programming":[["Which keyword declares a block-scoped variable in JavaScript?","let",["var","let","int","dim"]],["What does CSS stand for?","Cascading Style Sheets",["Cascading Style Sheets","Computer Style Sheets","Creative Style System","Colorful Style Sheets"]],["Which hook stores state in a React function component?","useState",["useEffect","useState","useRef","useMemo"]],["Which HTTP method is normally used to read data?","GET",["POST","PUT","GET","DELETE"]],["Which data structure works on LIFO?","Stack",["Queue","Stack","Tree","Graph"]],["What is the time complexity of binary search?","O(log n)",["O(n)","O(n log n)","O(log n)","O(1)"]]],
"General Knowledge":[["Which planet is known as the Red Planet?","Mars",["Venus","Mars","Jupiter","Saturn"]],["Who wrote the Indian national anthem?","Rabindranath Tagore",["Bankim Chandra","Rabindranath Tagore","Sarojini Naidu","Premchand"]],["Which river flows through Kanpur?","Ganga",["Yamuna","Ganga","Narmada","Godavari"]],["What is the capital of Japan?","Tokyo",["Kyoto","Osaka","Tokyo","Seoul"]],["How many continents are there?","7",["5","6","7","8"]],["Which gas do plants absorb for photosynthesis?","Carbon dioxide",["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"]]]};
var m=document.getElementById("m"),cat,L,i,sc,tm,tl,rv,hs=0;try{hs=+localStorage.getItem("qa")||0}catch(e){}
function shuf(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function home(){m.innerHTML='<div class="card"><h3 style="margin-top:0">Choose a category</h3><p class="mu">6 questions · 15 seconds each · High score: '+hs+'/6</p>'+Object.keys(Q).map(function(k){return'<button class="p o" data-c="'+k+'">'+k+'</button>'}).join("")+'</div>'}
function start(c){cat=c;L=shuf(Q[c]);i=0;sc=0;rv=[];ask()}
function ask(){clearInterval(tm);tl=15;var q=L[i];m.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><span class="mu">Question '+(i+1)+' of '+L.length+'</span><b id="tt">15s</b></div><div class="bar"><i id="tb" style="width:100%"></i></div><h3>'+q[0]+'</h3>'+shuf(q[2]).map(function(o){return'<button class="o" data-a="'+o+'">'+o+'</button>'}).join("")+'</div>';
tm=setInterval(function(){tl--;var t=document.getElementById("tt");if(!t)return clearInterval(tm);t.textContent=tl+"s";document.getElementById("tb").style.width=tl/15*100+"%";if(tl<=0)pick(null)},1000)}
function pick(a,b){clearInterval(tm);var q=L[i];document.querySelectorAll(".o").forEach(function(x){x.disabled=true;if(x.dataset.a==q[1])x.classList.add("ok");else if(x===b)x.classList.add("no")});if(a==q[1])sc++;rv.push([q[0],q[1],a||"No answer"]);setTimeout(function(){i++;i<L.length?ask():end()},900)}
function end(){if(sc>hs){hs=sc;try{localStorage.setItem("qa",hs)}catch(e){}}m.innerHTML='<div class="card"><h2 style="margin-top:0">Score: '+sc+' / '+L.length+'</h2><p class="mu">High score: '+hs+'</p>'+rv.map(function(r){return'<p><b>'+r[0]+'</b><br>Correct: '+r[1]+' · Your answer: <span style="color:var(--'+(r[1]==r[2]?'ok':'bad')+')">'+r[2]+'</span></p>'}).join("")+'<button class="p" id="re">Play again</button></div>'}
m.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.c)start(b.dataset.c);else if(b.dataset.a!==undefined&&!b.disabled)pick(b.dataset.a,b);else if(b.id=="re")home()});
home();
</script></body></html>
